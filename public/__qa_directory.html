id:&quot;currency&quot;,label:&quot;Comprendre les prix en francs CFA&quot;,sub:&quot;Distinguer XOF, XAF et frais de transfert&quot;,guides:[&quot;xof-xaf&quot;,&quot;eviter-fausses-annonces&quot;],why:&quot;Pour comprendre la monnaie affich\xE9e et garder les bons r\xE9flexes avant un paiement.&quot;}],land:[{id:&quot;terrain&quot;,label:&quot;V\xE9rifier le terrain avant d\u2019acheter&quot;,sub:&quot;Parcelle, documents et intervenants&quot;,guides:[&quot;verifier-terrain&quot;,&quot;choisir-geometre&quot;],why:&quot;Pour pr\xE9parer les contr\xF4les sur la parcelle et choisir un g\xE9om\xE8tre.&quot;},{id:&quot;build&quot;,label:&quot;Pr\xE9parer mon budget de construction&quot;,sub:&quot;Rep\xE9rer les d\xE9penses et comparer les devis&quot;,guides:[&quot;budget-construction&quot;,&quot;verifier-terrain&quot;],why:&quot;Pour structurer le budget et v\xE9rifier que le terrain convient au projet.&quot;},{id:&quot;distance&quot;,label:&quot;Acheter depuis l\u2019\xE9tranger&quot;,sub:&quot;Organiser les contr\xF4les sans \xEAtre sur place&quot;,guides:[&quot;acheter-distance&quot;,&quot;verifier-terrain&quot;],why:&quot;Pour organiser les intervenants \xE0 distance et v\xE9rifier la parcelle.&quot;}],rent:[{id:&quot;security&quot;,label:&quot;Rep\xE9rer les annonces \xE0 risque&quot;,sub:&quot;\xC9viter les pi\xE8ges avant de r\xE9server&quot;,guides:[&quot;eviter-fausses-annonces&quot;],why:&quot;Pour contr\xF4ler une annonce et \xE9viter les paiements sous pression.&quot;},{id:&quot;visit&quot;,label:&quot;Pr\xE9parer mes premi\xE8res v\xE9rifications&quot;,sub:&quot;Photos, visite et identit\xE9 de l\u2019interlocuteur&quot;,guides:[&quot;eviter-fausses-annonces&quot;],why:&quot;Ce guide d\xE9taille les contr\xF4les sur les photos, la localisation et l\u2019interlocuteur.&quot;},{id:&quot;currency&quot;,label:&quot;Comprendre les prix en francs CFA&quot;,sub:&quot;Mieux lire un loyer en XOF ou en XAF&quot;,guides:[&quot;xof-xaf&quot;,&quot;eviter-fausses-annonces&quot;],why:&quot;Pour identifier la monnaie du loyer et v\xE9rifier une annonce avant de vous engager.&quot;}]};var oo=e=>typeof e==&quot;string&quot;?e:Array.isArray(e)?e.map(oo).join(&quot; &quot;):e&amp;&amp;typeof e==&quot;object&quot;?Object.values(e).map(oo).join(&quot; &quot;):&quot;&quot;,ul=e=>{let t=oo({intro:e.intro,sections:e.sections,checklist:e.checklist}).trim().split(/\s+/).filter(Boolean).length;return`${Math.max(2,Math.ceil(t/190))} min`},cl=[{id:&quot;verifier-terrain&quot;,category:&quot;Acheter&quot;,country:&quot;Afrique francophone&quot;,icon:&quot;\u{1F4C4}&quot;,title:&quot;Acheter un terrain : les v\xE9rifications avant de signer&quot;,excerpt:&quot;Une m\xE9thode compl\xE8te pour contr\xF4ler le vendeur, la parcelle, les documents et les paiements avant tout engagement.&quot;,updatedAt:&quot;21 septembre 2026&quot;,intro:&quot;L'achat d'un terrain ne doit jamais reposer uniquement sur une visite, une photo de document ou la recommandation d'un proche. Les appellations administratives, les proc\xE9dures et les autorit\xE9s comp\xE9tentes varient selon le pays et parfois selon la commune. L'objectif de ce guide est donc de vous donner une m\xE9thode de travail : identifier les personnes, v\xE9rifier s\xE9par\xE9ment le terrain et les droits invoqu\xE9s, conserver des preuves, puis faire formaliser la transaction par les professionnels comp\xE9tents.&quot;,sections:[{title:&quot;Identifier le vendeur et son pouvoir de vendre&quot;,text:&quot;Demandez l'identit\xE9 compl\xE8te du vendeur et comparez-la avec les documents pr\xE9sent\xE9s. S'il agit au nom d'une famille, d'une soci\xE9t\xE9, d'une succession ou d'un propri\xE9taire absent, exigez le document qui l'autorise \xE0 signer. Une simple affirmation orale, m\xEAme formul\xE9e devant plusieurs t\xE9moins, ne remplace pas une procuration ou une d\xE9cision valable. Pour une succession, identifiez les h\xE9ritiers et v\xE9rifiez qui peut engager l'ensemble. Pour une soci\xE9t\xE9, contr\xF4lez l'existence de la structure et le pouvoir de son repr\xE9sentant. Ne remettez pas vos originaux et conservez une copie dat\xE9e de chaque pi\xE8ce examin\xE9e.&quot;,bullets:[&quot;Pi\xE8ce d'identit\xE9 du vendeur&quot;,&quot;Justificatif de propri\xE9t\xE9 ou de droits&quot;,&quot;Procuration ou pouvoir de repr\xE9sentation&quot;,&quot;Coordonn\xE9es permettant une v\xE9rification ind\xE9pendante&quot;]},{title:&quot;Localiser pr\xE9cis\xE9ment la parcelle&quot;,text:&quot;Une parcelle doit \xEAtre identifi\xE9e autrement que par une description approximative du quartier. Demandez le plan, les r\xE9f\xE9rences cadastrales ou administratives disponibles, les coordonn\xE9es et les limites annonc\xE9es. Faites-vous accompagner par un g\xE9om\xE8tre ou un professionnel habilit\xE9 selon le pays. Comparez la superficie du document avec la r\xE9alit\xE9 du terrain et v\xE9rifiez l'acc\xE8s : une parcelle peut exister tout en \xE9tant enclav\xE9e ou concern\xE9e par un passage, une r\xE9serve, un projet de voirie ou une occupation. Rencontrez les voisins sans leur confier la d\xE9cision : leurs informations sont utiles pour d\xE9tecter un conflit, mais elles doivent \xEAtre recoup\xE9es.&quot;,bullets:[&quot;Limites et superficie&quot;,&quot;Acc\xE8s l\xE9gal et praticable&quot;,&quot;Occupation actuelle&quot;,&quot;Servitudes, voirie ou projet public connu&quot;]},{title:&quot;Contr\xF4ler les documents aupr\xE8s des bonnes autorit\xE9s&quot;,text:&quot;Ne v\xE9rifiez pas un document uniquement aupr\xE8s de la personne qui vous l'a remis. Faites confirmer son authenticit\xE9, sa port\xE9e et son actualit\xE9 aupr\xE8s du service comp\xE9tent et d'un professionnel ind\xE9pendant. Un document authentique peut \xEAtre ancien, incomplet, d\xE9j\xE0 utilis\xE9 dans une autre vente ou ne pas suffire \xE0 transf\xE9rer la propri\xE9t\xE9. Demandez aussi si des taxes, redevances, hypoth\xE8ques, oppositions ou litiges sont attach\xE9s au bien. Les titres et proc\xE9dures diff\xE8rent d'un pays \xE0 l'autre : Sokil\xE9 ne pr\xE9sente donc jamais une liste universelle comme suffisante.&quot;},{title:&quot;V\xE9rifier la situation physique et l'usage possible&quot;,text:&quot;Visitez le terrain \xE0 plusieurs moments si possible. Observez les acc\xE8s en saison des pluies, les raccordements, le relief, les eaux, le voisinage et les constructions proches. Si vous pr\xE9voyez de construire, renseignez-vous sur les r\xE8gles d'urbanisme, les retraits, la hauteur, la destination de la zone et les autorisations n\xE9cessaires. Un terrain juridiquement transmissible peut ne pas convenir \xE0 votre projet ou n\xE9cessiter des travaux importants. Demandez des estimations s\xE9par\xE9es pour le bornage, la viabilisation, les \xE9tudes et les raccordements.&quot;},{title:&quot;Organiser les paiements et la signature&quot;,text:&quot;\xC9vitez les paiements en esp\xE8ces sans re\xE7u et les versements importants avant la fin des contr\xF4les. Chaque somme doit correspondre \xE0 une \xE9tape clairement \xE9crite : r\xE9servation, acompte, solde, frais professionnels ou taxes. Le document doit pr\xE9ciser les conditions de restitution lorsque la vente ne peut pas aboutir. Utilisez un moyen tra\xE7able et v\xE9rifiez l'identit\xE9 du titulaire du compte. Faites relire le projet d'acte avant la signature et ne signez jamais une page incompl\xE8te ou diff\xE9rente de celle qui vous a \xE9t\xE9 pr\xE9sent\xE9e.&quot;}],checklist:[&quot;Identit\xE9 et pouvoir du vendeur v\xE9rifi\xE9s&quot;,&quot;Parcelle localis\xE9e par un professionnel&quot;,&quot;Documents confirm\xE9s aupr\xE8s d'une source ind\xE9pendante&quot;,&quot;Situation d'urbanisme et acc\xE8s contr\xF4l\xE9s&quot;,&quot;Prix, frais et calendrier \xE9crits&quot;,&quot;Paiements tra\xE7ables et re\xE7us conserv\xE9s&quot;]},{id:&quot;choisir-geometre&quot;,category:&quot;Prestataires&quot;,country:&quot;Tous pays&quot;,icon:&quot;\u{1F4D0}&quot;,title:&quot;Comment choisir un g\xE9om\xE8tre pour votre projet ?&quot;,excerpt:&quot;Comp\xE9tences, mission, livrables et prix : les questions \xE0 poser avant une d\xE9limitation, un bornage ou une construction.&quot;,updatedAt:&quot;21 septembre 2026&quot;,intro:&quot;Le mot g\xE9om\xE8tre peut recouvrir des niveaux de qualification et des missions diff\xE9rentes selon le pays. Avant de comparer les prix, commencez donc par d\xE9finir ce que vous attendez : retrouver une parcelle, contr\xF4ler une superficie, mat\xE9rialiser des limites, produire un plan ou intervenir dans une proc\xE9dure officielle. Un devis peu cher n'est pas avantageux si le document livr\xE9 n'est pas utilisable pour votre d\xE9marche.&quot;,sections:[{title:&quot;V\xE9rifier son identit\xE9 professionnelle&quot;,text:&quot;Demandez le nom complet du professionnel ou de la soci\xE9t\xE9, son adresse, sa zone d'intervention et, lorsqu'il existe, son num\xE9ro d'inscription \xE0 l'ordre ou au registre comp\xE9tent. V\xE9rifiez cette information aupr\xE8s de l'organisme concern\xE9. Demandez des exemples de missions comparables sans exiger les documents confidentiels d'autres clients. Un professionnel s\xE9rieux doit pouvoir expliquer les limites de sa mission et vous dire lorsqu'un acte n\xE9cessite l'intervention d'une autre autorit\xE9.&quot;},{title:&quot;D\xE9crire la mission par \xE9crit&quot;,text:&quot;Indiquez la localisation, la superficie annonc\xE9e, les r\xE9f\xE9rences disponibles et le but de l'intervention. Pr\xE9cisez s'il faut rechercher les limites, poser des bornes, \xE9tablir un plan, effectuer un relev\xE9 topographique ou assister \xE0 une proc\xE9dure contradictoire. Le devis doit mentionner les d\xE9placements, le nombre de visites, les d\xE9marches incluses, les d\xE9lais et les livrables. Ajoutez la personne qui sera pr\xE9sente sur place si vous \xEAtes \xE0 distance.&quot;},{title:&quot;Comprendre les livrables&quot;,text:&quot;Demandez sous quel format le plan sera remis, quelles mentions il comportera et s'il sera sign\xE9 ou accompagn\xE9 d'un proc\xE8s-verbal. V\xE9rifiez que le livrable correspond \xE0 l'usage pr\xE9vu : pr\xE9paration d'un chantier, dossier administratif, clarification entre voisins ou transaction. Une image envoy\xE9e par messagerie ne remplace pas n\xE9cessairement un document exploitable. Pr\xE9voyez la remise des fichiers num\xE9riques et des originaux lorsqu'ils existent.&quot;},{title:&quot;Comparer des propositions \xE9quivalentes&quot;,text:&quot;Envoyez le m\xEAme descriptif \xE0 plusieurs professionnels afin de comparer des prestations identiques. Un \xE9cart peut venir du d\xE9placement, du mat\xE9riel, des recherches administratives, du nombre de points \xE0 relever ou de la complexit\xE9 du terrain. Demandez ce qui d\xE9clenchera un suppl\xE9ment. M\xE9fiez-vous \xE0 la fois d'un prix anormalement bas et d'un devis global qui ne d\xE9taille aucun r\xE9sultat attendu.&quot;},{title:&quot;Suivre la mission \xE0 distance&quot;,text:&quot;Convenez avant l'intervention des preuves \xE0 recevoir : rendez-vous dat\xE9, photos g\xE9olocalis\xE9es lorsque cela est possible, courte vid\xE9o du terrain, copie du plan et compte rendu. Ne demandez pas au g\xE9om\xE8tre de trancher seul une question de propri\xE9t\xE9. Son relev\xE9 d\xE9crit le terrain et ses limites techniques ; les droits doivent \xEAtre v\xE9rifi\xE9s avec les autorit\xE9s et professionnels juridiques comp\xE9tents.&quot;}],checklist:[&quot;Qualification v\xE9rifi\xE9e&quot;,&quot;Mission et prix \xE9crits&quot;,&quot;D\xE9lais pr\xE9cis\xE9s&quot;,&quot;Livrables identifi\xE9s&quot;,&quot;Suppl\xE9ments encadr\xE9s&quot;,&quot;Preuves et compte rendu pr\xE9vus&quot;]},{id:&quot;acheter-distance&quot;,category:&quot;Diaspora&quot;,country:&quot;International&quot;,icon:&quot;\u{1F30D}&quot;,title:&quot;Acheter depuis l'\xE9tranger sans avancer \xE0 l'aveugle&quot;,excerpt:&quot;Un protocole concret pour organiser les visites, les v\xE9rifications, les d\xE9cisions et les paiements lorsque vous \xEAtes loin.&quot;,updatedAt:&quot;21 septembre 2026&quot;,intro:&quot;La distance ne rend pas un achat impossible, mais elle augmente le risque de d\xE9pendre d'une seule personne et de prendre une d\xE9cision \xE0 partir d'informations choisies par le vendeur. La bonne r\xE9ponse n'est pas de multiplier les messages : c'est d'organiser le projet comme un dossier, avec des r\xF4les s\xE9par\xE9s, des preuves dat\xE9es, des \xE9tapes de validation et une r\xE8gle simple \u2014 aucune urgence commerciale ne doit supprimer une v\xE9rification essentielle.&quot;,sections:[{title:&quot;S\xE9parer les r\xF4les&quot;,text:&quot;\xC9vitez de confier la recherche du bien, la v\xE9rification des documents, la visite technique et la r\xE9ception de l'argent \xE0 une seule personne. Le vendeur ou l'agent peut organiser la visite, mais les v\xE9rifications importantes doivent \xEAtre r\xE9alis\xE9es par des intervenants ind\xE9pendants. D\xE9signez une personne de confiance pour constater la situation physique, un professionnel comp\xE9tent pour examiner les documents et, lorsque n\xE9cessaire, un notaire ou juriste pour formaliser la transaction. Chacun doit vous rendre compte directement. Cette s\xE9paration r\xE9duit les conflits d'int\xE9r\xEAts et rend les incoh\xE9rences plus visibles.&quot;},{title:&quot;Cr\xE9er un dossier partag\xE9 et une chronologie&quot;,text:&quot;Centralisez les pi\xE8ces dans un espace prot\xE9g\xE9 plut\xF4t que dans une succession de messages. Nommez les fichiers avec leur date et leur origine. Tenez une chronologie simple : premier contact, documents re\xE7us, personnes consult\xE9es, v\xE9rifications effectu\xE9es, questions ouvertes et paiements. Conservez \xE9galement les versions pr\xE9c\xE9dentes d'un document. Une modification de superficie, de prix, de nom ou de r\xE9f\xE9rence doit \xEAtre expliqu\xE9e. Ne partagez pas vos pi\xE8ces d'identit\xE9 avec plus de personnes que n\xE9cessaire et masquez les informations inutiles lorsque c'est possible.&quot;},{title:&quot;Exiger une visite exploitable&quot;,text:&quot;Une vid\xE9o doit permettre de comprendre le bien, pas seulement de le rendre attractif. Demandez un parcours continu depuis la rue, les acc\xE8s, chaque pi\xE8ce ou limite, les compteurs, les d\xE9fauts visibles et le voisinage imm\xE9diat. Demandez \xE0 la personne de prononcer la date et de montrer un \xE9l\xE9ment convenu \xE0 l'avance afin d'\xE9viter une ancienne vid\xE9o. Pour un terrain, compl\xE9tez par une localisation, un plan et l'intervention d'un professionnel. Une visite vid\xE9o ne remplace pas une expertise, mais elle \xE9vite de d\xE9cider sur des images promotionnelles.&quot;},{title:&quot;V\xE9rifier par des canaux ind\xE9pendants&quot;,text:&quot;Contactez vous-m\xEAme les professionnels et services utilis\xE9s pour les contr\xF4les. N'utilisez pas uniquement le num\xE9ro transmis par le vendeur : recherchez les coordonn\xE9es officielles lorsque cela est possible. Demandez au professionnel de vous adresser son rapport depuis sa propre adresse et r\xE9glez directement sa facture. Recoupez les noms, r\xE9f\xE9rences, dates, superficies et localisations. Une information r\xE9p\xE9t\xE9e par plusieurs personnes qui d\xE9pendent toutes du m\xEAme interm\xE9diaire n'est pas encore une v\xE9rification ind\xE9pendante.&quot;},{title:&quot;D\xE9cider par \xE9tapes&quot;,text:&quot;D\xE9finissez avant toute n\xE9gociation vos conditions minimales : documents indispensables, r\xE9sultat des contr\xF4les, budget total, d\xE9lai et personne autoris\xE9e \xE0 signer. Utilisez une liste de points bloquants. Si une pi\xE8ce manque, notez-la comme manquante au lieu de la consid\xE9rer comme promise. Un acompte ne doit intervenir qu'apr\xE8s un \xE9crit qui pr\xE9cise son objet, son b\xE9n\xE9ficiaire et les conditions de restitution. Le solde doit d\xE9pendre de la signature et des formalit\xE9s pr\xE9vues pour le pays concern\xE9.&quot;},{title:&quot;Encadrer une procuration&quot;,text:&quot;Une procuration donne un pouvoir r\xE9el : elle doit donc \xEAtre limit\xE9e \xE0 des actes pr\xE9cis, une dur\xE9e, un bien et, si possible, des montants. \xC9vitez les formulations g\xE9n\xE9rales permettant de vendre, emprunter ou recevoir des fonds sans limite. Faites confirmer la forme requise dans le pays du bien et dans le pays o\xF9 vous signez. Demandez un compte rendu de chaque acte accompli. Lorsque la procuration n'est plus n\xE9cessaire, renseignez-vous sur les modalit\xE9s de r\xE9vocation et de notification.&quot;},{title:&quot;Pr\xE9parer le co\xFBt complet&quot;,text:&quot;Le prix annonc\xE9 n'est qu'une partie du projet. Ajoutez les v\xE9rifications, d\xE9placements, honoraires, taxes, formalit\xE9s, change, frais bancaires, travaux imm\xE9diats et marge d'impr\xE9vu. Comparez les montants en monnaie locale et conservez le taux utilis\xE9 pour vos d\xE9cisions. Avant un transfert important, v\xE9rifiez aupr\xE8s de votre banque les justificatifs demand\xE9s et le nom exact du b\xE9n\xE9ficiaire. Un changement de compte au dernier moment doit suspendre le paiement jusqu'\xE0 confirmation ind\xE9pendante.&quot;},{title:&quot;Savoir interrompre le projet&quot;,text:&quot;Une pression constante, un refus de fournir des originaux, des coordonn\xE9es impossibles \xE0 v\xE9rifier, des versions contradictoires ou une demande de paiement vers un tiers sont des raisons de faire une pause. Interrompre un dossier ne signifie pas accuser quelqu'un de fraude : cela signifie que le niveau de preuve n'est pas suffisant. Fixez un d\xE9lai raisonnable pour obtenir les \xE9l\xE9ments manquants et gardez une trace \xE9crite de votre d\xE9cision. La peur de perdre une opportunit\xE9 ne doit jamais vous faire accepter un risque que vous n'auriez pas accept\xE9 sur place.&quot;}],checklist:[&quot;Intervenants ind\xE9pendants identifi\xE9s&quot;,&quot;Dossier partag\xE9 et chronologie cr\xE9\xE9s&quot;,&quot;Visite r\xE9cente et exploitable obtenue&quot;,&quot;Documents v\xE9rifi\xE9s hors du canal du vendeur&quot;,&quot;Conditions de paiement \xE9crites&quot;,&quot;Procuration limit\xE9e si n\xE9cessaire&quot;,&quot;Budget total calcul\xE9&quot;,&quot;Points bloquants trait\xE9s avant signature&quot;]},{id:&quot;xof-xaf&quot;,category:&quot;Comprendre&quot;,country:&quot;Zone franc CFA&quot;,icon:&quot;\u{1F4B1}&quot;,title:&quot;XOF et XAF : comprendre les deux francs CFA&quot;,excerpt:&quot;Deux monnaies distinctes, une parit\xE9 similaire avec l'euro et des circuits bancaires qu'il ne faut pas confondre.&quot;,updatedAt:&quot;21 septembre 2026&quot;,intro:&quot;XOF et XAF sont souvent appel\xE9s tous les deux \xAB franc CFA \xBB, mais ils appartiennent \xE0 deux zones mon\xE9taires distinctes. Cette distinction compte lorsque vous comparez une annonce, pr\xE9parez un virement ou signez un document. Le m\xEAme nombre de francs ne suffit pas \xE0 identifier la monnaie : le pays et le code mon\xE9taire doivent appara\xEEtre.&quot;,sections:[{title:&quot;Deux zones diff\xE9rentes&quot;,text:&quot;Le XOF est utilis\xE9 dans l'Union \xE9conomique et mon\xE9taire ouest-africaine, tandis que le XAF est utilis\xE9 dans la Communaut\xE9 \xE9conomique et mon\xE9taire de l'Afrique centrale. Les billets, les banques centrales et les circuits de paiement ne sont pas interchangeables. Dans une annonce, exigez donc le code XOF ou XAF et le pays, surtout lorsqu'un prix est transmis par capture d'\xE9cran ou message.&quot;},{title:&quot;Comprendre la conversion en euros&quot;,text:&quot;Les deux monnaies ont une parit\xE9 fixe avec l'euro, mais un transfert r\xE9el peut inclure des frais bancaires, des commissions, des d\xE9lais et des \xE9carts li\xE9s au service utilis\xE9. Sur Sokil\xE9, la monnaie locale reste la r\xE9f\xE9rence de l'annonce ; l'\xE9quivalent en euros est un rep\xE8re arrondi. Le contrat doit indiquer la monnaie dans laquelle le prix est exigible et la mani\xE8re de traiter les frais.&quot;},{title:&quot;Comparer correctement les prix&quot;,text:&quot;Comparez des biens semblables dans la m\xEAme ville, le m\xEAme quartier et la m\xEAme monnaie. Un prix au m\xE8tre carr\xE9 peut aider, mais il ne refl\xE8te pas \xE0 lui seul le statut juridique, l'acc\xE8s, l'\xE9tat, les raccordements ou la qualit\xE9 de construction. Notez la date du prix et \xE9vitez de convertir plusieurs fois entre devises : les arrondis finissent par cr\xE9er des \xE9carts importants.&quot;},{title:&quot;Pr\xE9parer un transfert&quot;,text:&quot;Demandez l'identit\xE9 exacte du b\xE9n\xE9ficiaire, l'\xE9tablissement, le pays, la devise du compte et le motif attendu. V\xE9rifiez aupr\xE8s de votre banque les justificatifs n\xE9cessaires. Testez \xE9ventuellement un petit montant lorsque le professionnel le recommande, sans consid\xE9rer ce test comme une validation juridique du b\xE9n\xE9ficiaire. Refusez tout changement de coordonn\xE9es non confirm\xE9 par un autre canal.&quot;}],checklist:[&quot;Code XOF ou XAF indiqu\xE9&quot;,&quot;Pays et b\xE9n\xE9ficiaire confirm\xE9s&quot;,&quot;Monnaie du contrat pr\xE9cis\xE9e&quot;,&quot;Frais bancaires estim\xE9s&quot;,&quot;Coordonn\xE9es v\xE9rifi\xE9es par un second canal&quot;]},{id:&quot;budget-construction&quot;,category:&quot;Construire&quot;,country:&quot;Tous pays&quot;,icon:&quot;\u{1F3D7}\uFE0F&quot;,title:&quot;Pr\xE9parer le budget d'une construction&quot;,excerpt:&quot;Du terrain \xE0 la r\xE9ception : les postes \xE0 chiffrer, la marge d'impr\xE9vu et les preuves \xE0 exiger pendant le chantier.&quot;,updatedAt:&quot;21 septembre 2026&quot;,intro:&quot;Un budget de construction cr\xE9dible ne se r\xE9sume pas au prix des murs et de la toiture. Il doit int\xE9grer les \xE9tudes, les d\xE9marches, l'installation du chantier, les raccordements, le suivi et une r\xE9serve. La meilleure protection consiste \xE0 comparer des devis fond\xE9s sur le m\xEAme projet et \xE0 relier chaque paiement \xE0 un r\xE9sultat v\xE9rifiable.&quot;,sections:[{title:&quot;Valider le terrain et le programme&quot;,text:&quot;Avant de chiffrer, confirmez la superficie, l'acc\xE8s, la topographie, la nature du sol, les r\xE8gles d'urbanisme et les r\xE9seaux disponibles. D\xE9crivez le nombre de pi\xE8ces, les surfaces, le niveau de finition et les \xE9quipements. Une phrase comme \xAB villa moderne quatre chambres \xBB ne permet pas \xE0 deux entreprises de calculer la m\xEAme chose. Faites produire des plans et un descriptif adapt\xE9s \xE0 la phase du projet.&quot;},{title:&quot;S\xE9parer les familles de co\xFBts&quot;,text:&quot;Cr\xE9ez des lignes distinctes pour les \xE9tudes et plans, autorisations, terrassement, gros \u0153uvre, toiture, menuiseries, \xE9lectricit\xE9, plomberie, rev\xEAtements, peinture, \xE9quipements, ext\xE9rieurs, raccordements et s\xE9curit\xE9. Ajoutez les transports, l'h\xE9bergement \xE9ventuel des \xE9quipes, le gardiennage, les assurances et le contr\xF4le. Cette s\xE9paration permet de rep\xE9rer un oubli et de comparer les offres.&quot;},{title:&quot;Comparer le m\xEAme p\xE9rim\xE8tre&quot;,text:&quot;Transmettez les m\xEAmes plans, quantit\xE9s et attentes \xE0 chaque entreprise. Demandez les marques ou niveaux de qualit\xE9 pr\xE9vus, les quantit\xE9s, la main-d'\u0153uvre, les d\xE9lais et les exclusions. Un devis moins cher peut simplement omettre les portes, les sanitaires, le raccordement ou les finitions. Faites corriger les ambigu\xEFt\xE9s avant de choisir et joignez le devis final au contrat.&quot;},{title:&quot;Planifier les paiements&quot;,text:&quot;D\xE9coupez le chantier en \xE9tapes observables et \xE9vitez de financer trop largement une phase future. Pour chaque appel de fonds, exigez un \xE9tat d'avancement, des photos dat\xE9es, les justificatifs convenus et, lorsque le budget le permet, le contr\xF4le d'un professionnel ind\xE9pendant. Pr\xE9voyez une retenue ou une derni\xE8re tranche li\xE9e \xE0 la r\xE9ception et \xE0 la correction des d\xE9fauts.&quot;},{title:&quot;Conserver une r\xE9serve&quot;,text:&quot;Une r\xE9serve de 10 \xE0 15 % peut absorber certaines variations, mais elle ne doit pas servir \xE0 masquer un devis incomplet. Toute modification du projet doit faire l'objet d'un chiffrage \xE9crit avant ex\xE9cution. Tenez un tableau du budget initial, des engagements, des paiements et du reste \xE0 payer. \xC0 distance, s\xE9parez la personne qui demande les fonds de celle qui v\xE9rifie l'avancement.&quot;},{title:&quot;Organiser la r\xE9ception&quot;,text:&quot;Avant le dernier paiement, inspectez les ouvrages, testez les \xE9quipements et dressez une liste \xE9crite des d\xE9fauts ou travaux inachev\xE9s. Photographiez les points concern\xE9s et fixez un d\xE9lai de correction. R\xE9cup\xE9rez les plans \xE0 jour, garanties, factures, r\xE9f\xE9rences des \xE9quipements et documents administratifs. Une remise des cl\xE9s sans dossier final rend les r\xE9parations futures plus difficiles.&quot;}],checklist:[&quot;Programme et niveau de finition d\xE9finis&quot;,&quot;\xC9tudes et autorisations budg\xE9t\xE9es&quot;,&quot;Devis comparables&quot;,&quot;Paiements li\xE9s \xE0 des \xE9tapes&quot;,&quot;Suivi ind\xE9pendant pr\xE9vu&quot;,&quot;R\xE9serve et tableau budg\xE9taire&quot;,&quot;R\xE9ception \xE9crite avant solde&quot;]},{id:&quot;eviter-fausses-annonces&quot;,category:&quot;S\xE9curit\xE9&quot;,country:&quot;Tous pays&quot;,icon:&quot;\u{1F6E1}\uFE0F&quot;,title:&quot;Reconna\xEEtre une annonce immobili\xE8re \xE0 risque&quot;,excerpt:&quot;Les signaux d'alerte, les contr\xF4les simples et la conduite \xE0 tenir avant de transmettre des documents ou de l'argent.&quot;,updatedAt:&quot;21 septembre 2026&quot;,intro:&quot;Une annonce trompeuse n'est pas toujours grossi\xE8re. Elle peut utiliser de vraies photos, un vrai quartier et m\xEAme des documents existants sans que la personne qui publie soit autoris\xE9e \xE0 vendre ou louer. L'objectif n'est pas de devenir enqu\xEAteur, mais de ralentir la d\xE9cision, v\xE9rifier l'interlocuteur et refuser tout paiement tant que les informations essentielles ne sont pas coh\xE9rentes.&quot;,sections:[{title:&quot;Rep\xE9rer les signaux de pression&quot;,text:&quot;Un prix tr\xE8s inf\xE9rieur au march\xE9, une urgence permanente, plusieurs pr\xE9tendus acheteurs et une remise conditionn\xE9e \xE0 un paiement imm\xE9diat doivent vous faire ralentir. Une opportunit\xE9 r\xE9elle peut avoir une \xE9ch\xE9ance, mais le vendeur doit accepter des v\xE9rifications raisonnables. Refusez les frais de dossier, de visite ou de r\xE9servation vers\xE9s sans document clair et identit\xE9 v\xE9rifi\xE9e.&quot;},{title:&quot;Contr\xF4ler les images et la localisation&quot;,text:&quot;Demandez des photos suppl\xE9mentaires cibl\xE9es et une vid\xE9o r\xE9cente. Recherchez si les m\xEAmes images apparaissent ailleurs avec une autre ville ou un autre contact. Comparez l'environnement visible avec la localisation annonc\xE9e. Pour un terrain, une photo de v\xE9g\xE9tation ne prouve ni la parcelle ni les droits. Exigez un plan, une visite et des r\xE9f\xE9rences v\xE9rifiables.&quot;},{title:&quot;V\xE9rifier l'interlocuteur&quot;,text:&quot;Demandez son nom complet, son r\xF4le, son agence \xE9ventuelle et son lien avec le propri\xE9taire. Recherchez les coordonn\xE9es officielles de l'agence au lieu d'utiliser uniquement celles de l'annonce. Un badge ou une fiche Sokil\xE9 indique le niveau de contr\xF4le effectu\xE9, mais ne remplace pas vos v\xE9rifications sur le bien et la transaction. Ne transmettez pas inutilement vos pi\xE8ces d'identit\xE9 ou donn\xE9es bancaires.&quot;},{title:&quot;Lire les incoh\xE9rences&quot;,text:&quot;Comparez les noms, dates, superficies, num\xE9ros, prix et signatures entre les documents et les messages. Demandez une explication \xE9crite \xE0 chaque diff\xE9rence. Un document flou, recadr\xE9 ou incomplet doit \xEAtre remplac\xE9 par une copie lisible, puis contr\xF4l\xE9 aupr\xE8s de la source comp\xE9tente. Ne vous laissez pas rassurer uniquement par le nombre de documents : leur authenticit\xE9 et leur port\xE9e comptent davantage.&quot;},{title:&quot;R\xE9agir sans prendre de risque&quot;,text:&quot;Suspendez les \xE9changes financiers, sauvegardez l'annonce et les conversations, puis signalez le contenu \xE0 Sokil\xE9. Si vous avez d\xE9j\xE0 pay\xE9, contactez rapidement votre banque ou le service de transfert et renseignez-vous aupr\xE8s des autorit\xE9s comp\xE9tentes. N'affrontez pas physiquement une personne suspecte et ne publiez pas ses donn\xE9es personnelles sur les r\xE9seaux sociaux. Conservez les preuves originales.&quot;}],checklist:[&quot;Prix compar\xE9 au march\xE9&quot;,&quot;Photos et vid\xE9o r\xE9centes&quot;,&quot;Identit\xE9 et r\xF4le confirm\xE9s&quot;,&quot;Documents lisibles et coh\xE9rents&quot;,&quot;Aucun paiement sous pression&quot;,&quot;Signalement effectu\xE9 en cas de doute&quot;]}].map(e=>({...e,reading:ul(e)}));var dl=[&quot;B\xE9nin&quot;,&quot;Burkina Faso&quot;,&quot;C\xF4te d'Ivoire&quot;,&quot;Mali&quot;,&quot;Niger&quot;,&quot;S\xE9n\xE9gal&quot;,&quot;Togo&quot;,&quot;Cameroun&quot;,&quot;Centrafrique&quot;,&quot;Congo&quot;,&quot;Gabon&quot;,&quot;Tchad&quot;],Cr=e=>[&quot;Cameroun&quot;,&quot;Centrafrique&quot;,&quot;Congo&quot;,&quot;Gabon&quot;,&quot;Tchad&quot;].includes(e)?&quot;XAF&quot;:&quot;XOF&quot;,Fn=[[&quot;acquisition&quot;,&quot;Frais d\u2019acquisition&quot;,&quot;Droits, notaire et formalit\xE9s : demandez un d\xE9compte local.&quot;],[&quot;agency&quot;,&quot;Frais d\u2019agence&quot;,&quot;Uniquement les frais \xE0 votre charge, hors prix d\xE9j\xE0 saisi.&quot;],[&quot;works&quot;,&quot;Travaux et raccordements&quot;,&quot;R\xE9novation, eau, \xE9lectricit\xE9, assainissement\u2026&quot;],[&quot;furniture&quot;,&quot;Mobilier et \xE9quipement&quot;,&quot;Si vous pr\xE9voyez de meubler ou d\u2019\xE9quiper le bien.&quot;],[&quot;other&quot;,&quot;Autres frais&quot;,&quot;Expertise, d\xE9p
